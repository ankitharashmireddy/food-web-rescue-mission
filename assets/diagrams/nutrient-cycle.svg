<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img" aria-label="Nutrient cycle">
  <rect width="520" height="340" rx="24" fill="#fffaf0"/>
  <g fill="none" stroke="#2e7d32" stroke-width="4">
    <circle cx="260" cy="170" r="112"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="260" cy="58" r="42" fill="#e8f3e8" stroke="#2e7d32" stroke-width="3"/><text x="260" y="64">Producers</text>
    <circle cx="402" cy="170" r="46" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="402" y="176">Consumers</text>
    <circle cx="260" cy="282" r="46" fill="#fff1d6" stroke="#b7791f" stroke-width="3"/><text x="260" y="288">Decomposers</text>
    <circle cx="118" cy="170" r="42" fill="#eef5e6" stroke="#4b3a2f" stroke-width="3"/><text x="118" y="176">Soil</text>
  </g>
  <text x="260" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b6350">Matter cycles; energy flows one way</text>
</svg>